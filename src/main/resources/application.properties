spring.application.name=gym-CRM
logging.level.org.springframework.security=DEBUG
spring.profiles.active=dev


# jdbc.X
jdbc.driverClassName=org.postgresql.Driver
jdbc.url=jdbc:postgresql://localhost:5432/gym
jdbc.user=armine
jdbc.pass=0000

# hibernate.X
hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
hibernate.show_sql=true
hibernate.hbm2ddl.auto=none

#actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

#metrics
management.metrics.enable.jvm=false
management.metrics.enable.logback=false
management.metrics.enable.process.uptime=false

# Liquibase settings
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/changelog-cumulative.yml

#JWT
token.signing.key=53A73E5F1C4E0A2D3B5F2D784E6A1B423D6F247D1F6E5C3A596D635A75327855

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/


spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=artemis
spring.activemq.password=artemis

activemq.destination=trainerWorkload.queue

